<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>{% block title %}足彩预测工具{% endblock %}</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<nav>
  {# 当前页高亮由服务端渲染，避免前端 JS 判断导致的闪烁 #}
  {% set path = request.url.path if request else '' %}
  <a class="brand{% if path == '/' %} active{% endif %}" href="/">足彩分析</a>
  <a href="/predict"  {% if path == '/predict'  %}class="active"{% endif %}>本期预测</a>
  <a href="/plan"     {% if path == '/plan'     %}class="active"{% endif %}>推荐方案</a>
  <a href="/history"  {% if path == '/history'  %}class="active"{% endif %}>历史战绩</a>
  <a href="/jc"       {% if path == '/jc'       %}class="active"{% endif %}>竞彩方案</a>
  <a href="/backtest" {% if path == '/backtest' %}class="active"{% endif %}>回测报告</a>
  <a href="/collect"  {% if path == '/collect'  %}class="active"{% endif %}>采集</a>
</nav>
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
