{% extends "base.html" %}
{% block title %}本期预测{% endblock %}
{% block content %}
<h2>本期预测</h2>
<p class="hint" id="info">加载中…</p>
<section id="alias-panel" class="alias-panel" hidden>
  <strong>待确认球队</strong>
  <select id="alias-name"></select>
  <input id="alias-team" list="team-options" placeholder="English team name" />
  <datalist id="team-options"></datalist>
  <button id="alias-confirm" type="button">确认映射</button>
  <span class="hint" id="alias-status"></span>
</section>
<div class="table-scroll">
<table id="predict-table">
<thead>
<tr><th rowspan="2">#</th><th rowspan="2">主队</th><th rowspan="2">客队</th><th rowspan="2">联赛</th><th rowspan="2">时间</th>
  <th colspan="3">市场</th><th colspan="3">DC</th><th colspan="3">GBDT</th><th colspan="3">融合</th><th rowspan="2">状态</th></tr>
<tr><th>主</th><th>平</th><th>负</th><th>主</th><th>平</th><th>负</th><th>主</th><th>平</th><th>负</th><th>主</th><th>平</th><th>负</th></tr>
</thead>
<tbody></tbody>
</table>
</div>
{% endblock %}
{% block scripts %}
<script>
const info = document.getElementById("info");
const panel = document.getElementById("alias-panel");
const nameSelect = document.getElementById("alias-name");
const teamInput = document.getElementById("alias-team");
const teamOptions = document.getElementById("team-options");
const aliasStatus = document.getElementById("alias-status");

function fmt(p) { return p == null ? "-" : (p * 100).toFixed(1) + "%"; }
function appendCell(tr, value, className) {
  const td = document.createElement("td");
  td.textContent = value == null ? "" : String(value);
  if (className) td.className = className;
  tr.appendChild(td);
}
function appendProbs(tr, probs) {
  [0, 1, 2].forEach(i => appendCell(tr, fmt(probs ? probs[i] : null)));
}

async function loadAliasOptions(unmapped) {
  if (!unmapped || !unmapped.length) {
    panel.hidden = true;
    return;
  }
  const response = await fetch("/api/teams");
  const data = await response.json();
  nameSelect.replaceChildren();
  unmapped.forEach(item => {
    const option = document.createElement("option");
    option.value = item.name_cn;
    option.textContent = `${item.seq} ${item.side === "home" ? "主" : "客"}：${item.name_cn}`;
    nameSelect.appendChild(option);
  });
  teamOptions.replaceChildren();
  (data.teams || []).forEach(team => {
    const option = document.createElement("option");
    option.value = team.name_en;
    option.label = team.name_cn || team.name_en;
    teamOptions.appendChild(option);
  });
  teamInput.value = "";
  aliasStatus.textContent = "";
  panel.hidden = false;
}

async function load() {
  const response = await fetch("/api/predict");
  const j = await response.json();
  if (j.warning) {
    info.textContent = j.warning;
    panel.hidden = true;
    return;
  }
  const warningCount = (j.unmapped || []).length;
  const statusText = j.is_current ? "在售" : "历史期次";
  const saleEnd = j.sale_end ? `，本期截止 ${j.sale_end}` : "";
  info.textContent = `期号 ${j.period_no}（${statusText}${saleEnd}，${j.matches.length} 场）` +
    (warningCount ? `，${warningCount} 个球队待确认` : "");
  const tbody = document.querySelector("#predict-table tbody");
  tbody.replaceChildren();
  j.matches.forEach(m => {
    const tr = document.createElement("tr");
    appendCell(tr, m.seq);
    appendCell(tr, m.home); appendCell(tr, m.away);
    appendCell(tr, m.league_cn || "");
    appendCell(tr, m.match_time || "");
    if (m.has_prediction) {
      appendProbs(tr, m.market);
      appendProbs(tr, m.dc);
      appendProbs(tr, m.gbdt);
      appendProbs(tr, m.fused);
    } else {
      // 无映射且无赔率：不得渲染 Fusion 回退出的均匀分布（假 33.3%）
      for (let i = 0; i < 12; i++) appendCell(tr, "—");
    }
    appendCell(tr, m.mapped ? "已匹配" : (m.has_prediction ? "待确认" : "暂无预测（赔率待更新）"),
               m.mapped ? "mapped" : "warning");
    tbody.appendChild(tr);
  });
  await loadAliasOptions(j.unmapped || []);
}

document.getElementById("alias-confirm").addEventListener("click", async () => {
  const nameCn = nameSelect.value.trim();
  const nameEn = teamInput.value.trim();
  if (!nameCn || !nameEn) {
    aliasStatus.textContent = "请选择球队并填写英文名";
    return;
  }
  const response = await fetch("/api/alias/confirm", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name_cn: nameCn, name_en: nameEn})
  });
  const result = await response.json();
  if (!response.ok) {
    aliasStatus.textContent = result.detail || "确认失败";
    return;
  }
  aliasStatus.textContent = "已保存，正在刷新匹配";
  await load();
});

load().catch(error => { info.textContent = "加载失败：" + error; });
</script>
{% endblock %}
