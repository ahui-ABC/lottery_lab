# 足彩预测工具配置（设计文档 §11 描述）
db_path: data/football.db
budget_per_game: 64        # 元/玩法（14 场与任九各自独立）
ticket_price: 2            # 元/注（足彩固定 2 元）
use_lightgbm: true         # 3.14 装不上时切 false，自动改用 sklearn.HistGradientBoostingClassifier

divisions:                 # football-data 联赛代码
  [E0, E1, D1, I1, SP1, F1, N1, P1, SC0]

seasons: ["2122", "2223", "2324", "2425", "2526", "2627"]

market:
  odds_source: avg         # avg | max；回测选优后写此键

dc:
  half_life_days: 365      # T13 回测选优（90/180/365 三点中 365 略胜）

backtest:
  train_years: 4
  refit_days: 7

fusion:
  mode: market_primary     # full | market_primary；当前融合回测未超过市场基线
